name: Laboratory 5 Coverage
run-name: Coverage - ${{ inputs.suite || 'full' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        required: true
        default: full
        options:
          - full
          - reduced

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Measure line coverage
        env:
          TEST_SUITE: ${{ inputs.suite || 'full' }}
        run: |
          if [ "$TEST_SUITE" = reduced ]; then
            python -m coverage run --source=shipping -m pytest -q -k rejects_negative
          else
            python -m coverage run --source=shipping -m pytest -q
          fi
      # Generate both reports before enforcing the threshold.
      - name: Generate HTML and XML reports
        run: |
          python -m coverage html -d reports/html
          python -m coverage xml -o reports/coverage.xml
      - name: Enforce 70% line coverage
        run: python -m coverage report -m --fail-under=70
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ inputs.suite || 'full' }}
          path: reports/
          if-no-files-found: warn
